[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-data-pipeline"
version = "0.1.0"
description = "Portfolio-grade end-to-end data engineering pipeline"
requires-python = ">=3.12,<3.13"

dependencies = [
    "boto3",
    "httpx",
    "psycopg[binary]",
    "pyarrow",
    "pydantic",
    "python-dotenv",
    "tenacity",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true