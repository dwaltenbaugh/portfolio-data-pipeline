---
# Development-only infrastructure and Airflow overrides.

x-dev-airflow:
  &dev-airflow

  # Build the application image from the current working tree.
  build: .

  environment:
    PIPELINE_ENV: dev

    # Docker service names replace the host-facing addresses from .env.dev.
    S3_ENDPOINT_URL: http://minio:9000
    PIPELINE_DB_HOST: pipeline-db
    PIPELINE_DB_PORT: "5432"

    # Development keeps task logs local.
    AIRFLOW__LOGGING__REMOTE_LOGGING: "false"

    # SNS notifications will be disabled explicitly in the DAG later.
    ENABLE_FAILURE_NOTIFICATIONS: "false"

  # Development bind mounts make DAG edits immediately visible and
  # preserve local logs without rebuilding the image.
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins

  restart: always


services:
  airflow-init:
    <<: *dev-airflow

    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


  airflow-apiserver:
    <<: *dev-airflow

    # Development publishes Airflow directly to the host.
    ports:
      - "8080:8080"


  airflow-scheduler:
    <<: *dev-airflow


  airflow-dag-processor:
    <<: *dev-airflow


  airflow-worker:
    <<: *dev-airflow


  airflow-triggerer:
    <<: *dev-airflow


  airflow-cli:
    <<: *dev-airflow


  flower:
    <<: *dev-airflow

    ports:
      - "5555:5555"


  # ------------------------------------------------------------
  # DEVELOPMENT-ONLY INFRASTRUCTURE
  # ------------------------------------------------------------

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "airflow",
        ]
      interval: 10s
      retries: 5
      start_period: 5s

    restart: always


  redis:
    image: redis:7.2-bookworm

    expose:
      - "6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping",
        ]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s

    restart: always


  minio:
    image: quay.io/minio/minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

    restart: always


  pipeline-db:
    image: postgres:16

    environment:
      POSTGRES_DB: ${PIPELINE_DB_NAME:?Set PIPELINE_DB_NAME}
      POSTGRES_USER: ${PIPELINE_DB_USER:?Set PIPELINE_DB_USER}
      POSTGRES_PASSWORD: ${PIPELINE_DB_PASSWORD:?Set PIPELINE_DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - pipeline-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: always


volumes:
  postgres-db-volume:
  pipeline-db-data:
  minio-data: