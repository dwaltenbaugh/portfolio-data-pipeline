---
# Settings common to Airflow in every environment.
#
# Environment-specific files add:
# - build vs. prebuilt image behavior
# - local vs. external infrastructure
# - ports and bind mounts
# - CloudWatch and SNS configuration

x-airflow-common:
  &airflow-common

  image: ${AIRFLOW_IMAGE_NAME:?Set AIRFLOW_IMAGE_NAME}

  env_file:
    - ${ENV_FILE_PATH:?Set ENV_FILE_PATH}

  environment:
    &airflow-common-env

    AIRFLOW__CORE__EXECUTOR: CeleryExecutor

    AIRFLOW__CORE__AUTH_MANAGER: >-
      airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      ${AIRFLOW_DATABASE_URL:?Set AIRFLOW_DATABASE_URL}

    AIRFLOW__CELERY__RESULT_BACKEND: >-
      ${AIRFLOW_RESULT_BACKEND:?Set AIRFLOW_RESULT_BACKEND}

    AIRFLOW__CELERY__BROKER_URL: >-
      ${AIRFLOW_BROKER_URL:?Set AIRFLOW_BROKER_URL}

    AIRFLOW__CORE__FERNET_KEY: >-
      ${FERNET_KEY:?Set FERNET_KEY}

    AIRFLOW__API_AUTH__JWT_SECRET: >-
      ${AIRFLOW_API_AUTH_JWT_SECRET:?Set AIRFLOW_API_AUTH_JWT_SECRET}

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: >-
      http://airflow-apiserver:8080/execution/

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    AIRFLOW__LOGGING__REMOTE_LOGGING: >-
      ${AIRFLOW_REMOTE_LOGGING:-false}

    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg

  user: "${AIRFLOW_UID:-50000}:0"

services:
  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow version

    environment:
      <<: *airflow-common-env

      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"

      _AIRFLOW_WWW_USER_USERNAME: >-
        ${AIRFLOW_ADMIN_USERNAME:?Set AIRFLOW_ADMIN_USERNAME}

      _AIRFLOW_WWW_USER_PASSWORD: >-
        ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD}

    user: "0:0"

    restart: "no"

  airflow-apiserver:
    <<: *airflow-common

    command: api-server

    expose:
      - "8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common

    command: dag-processor

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common

    command: celery worker

    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"

    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          celery
          --app airflow.providers.celery.executors.celery_executor.app
          inspect ping
          -d "celery@$${HOSTNAME}"
          ||
          celery
          --app airflow.executors.celery_executor.app
          inspect ping
          -d "celery@$${HOSTNAME}"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      airflow-apiserver:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common

    command: triggerer

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-cli:
    <<: *airflow-common

    profiles:
      - debug

    command:
      - bash
      - -c
      - airflow

    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  flower:
    <<: *airflow-common

    command: celery flower

    profiles:
      - flower

    expose:
      - "5555"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:5555/",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      airflow-init:
        condition: service_completed_successfully